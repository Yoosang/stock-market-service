x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stock_market_dev
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 200m
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    mem_limit: 100m
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: .
    depends_on:
      - db
      - redis
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      LOGGING_FILE_NAME: /app/logs/app.log
    volumes:
      - backend-logs:/app/logs
    mem_limit: 450m
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    mem_limit: 50m
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  certbot-etc:
  certbot-webroot:
  backend-logs:
