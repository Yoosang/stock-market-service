services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stock_market_dev
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "2525:25"
      - "5001:80"

volumes:
  pgdata:
  redisdata:
