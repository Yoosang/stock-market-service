spring:
  application:
    name: stock-market-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/stock_market_dev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    # 로컬 개발 기본값은 프론트 dev 서버(localhost:3000). 배포 시 CORS_ALLOWED_ORIGIN으로 재정의.
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  jwt:
    # HS256 서명에 사용할 비밀키 — 반드시 32자 이상의 랜덤 문자열로 설정
    secret: ${JWT_SECRET}
    expiration-ms: 1800000  # 30분
    # 로컬(http, same-site)은 Secure=false/SameSite=Lax, 배포(https, cross-site)는 true/None
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  news:
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      uri: https://openapi.naver.com
      path: /v1/search/news.json
  kis:
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}
    rest-uri: https://openapi.koreainvestment.com:9443
    rest-path: /oauth2/Approval
    ws-uri: ws://ops.koreainvestment.com:21000

logging:
  file:
    # 로컬 개발은 콘솔 출력만 유지(미설정), 배포 시 LOGGING_FILE_NAME으로 파일 경로 지정
    name: ${LOGGING_FILE_NAME:}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
